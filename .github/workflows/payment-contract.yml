name: Payment route contract
on:
  pull_request:
    paths:
      - 'app/api/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/payment-contract.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  payment-flow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Run secret-free payment, links and billing contract tests
        run: node --experimental-vm-modules --test tests/*.test.mjs
